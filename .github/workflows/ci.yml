name: Django CI

# Коли запускати: при кожному пуші або Pull Request у гілку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Піднімаємо PostgreSQL та Redis прямо в хмарі GitHub для тестів
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devdesk_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      # 1. Завантажуємо твій код із репозиторію
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Встановлюємо Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Ставимо бібліотеки
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запускаємо твої 6 тестів на реальній базі PostgreSQL
      - name: Run Django tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          POSTGRES_DB: devdesk_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: |
          python manage.py test